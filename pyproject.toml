[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cos-tool"
version = "0.1.0"
description = "Transforms PromQL/LogQL expressions on the fly, and validates that Alert rules can be loaded successfully by either Prometheus or Loki."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = ["prometheus", "loki", "promql", "logql", "cos", "juju", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
cos-tool = "cos_tool.cli:main"

[project.urls]
Homepage = "https://github.com/canonical/cos-tool-py"
Repository = "https://github.com/canonical/cos-tool-py"

[tool.hatch.build.targets.wheel]
packages = ["src/cos_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
